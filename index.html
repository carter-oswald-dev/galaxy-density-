<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy Counter</title>

<style>

body{
    background:#0b1020;
    color:white;
    font-family:Arial, sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:#182238;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
}

input, select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

#error{
    color:#ff6666;
    font-weight:bold;
    margin-top:10px;
}

#circleContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:220px;
}

#circle{
    border:3px solid white;
    border-radius:50%;
}

.result{
    font-size:2rem;
    font-weight:bold;
    text-align:center;
}

.stat{
    margin-top:10px;
}

.small{
    color:#cccccc;
}

</style>
</head>
<body>

<h1>Galaxy Counter</h1>

<div class="card">

<h2>Measurements</h2>

<label>Phone Screen Width (cm)</label>
<input
id="screenWidth"
type="number"
value="7"
step="0.1">

<label>Arm Length (cm)</label>
<input
id="armLength"
type="number"
value="60"
step="0.1">

<label>Circle Width (cm)</label>
<input
id="circleWidth"
type="number"
value="2"
step="0.1">

<label>Density Model</label>
<select id="densityModel">

<option value="70000">
XKCD Style Estimate
</option>

<option value="700000">
High Estimate (10×)
</option>

<option value="custom">
Custom
</option>

</select>

<div id="customArea" style="display:none">

<label>
Custom Density
(Galaxies per Square Degree)
</label>

<input
id="customDensity"
type="number"
value="70000">

</div>

<div id="error"></div>

</div>

<div class="card">

<h2>Circle Preview</h2>

<div id="circleContainer">
<div id="circle"></div>
</div>

<div class="small">
Circle is scaled relative to your entered screen width.
</div>

</div>

<div class="card">

<div class="result" id="galaxyCount">
0
</div>

<div style="text-align:center;">
Estimated Galaxies
</div>

<hr>

<div class="stat">
Angular Diameter:
<span id="angularDiameter">0</span>°
</div>

<div class="stat">
Sky Area:
<span id="skyArea">0</span>
square degrees
</div>

<div class="stat">
Density:
<span id="densityUsed">0</span>
galaxies/sq°
</div>

</div>

<script>

const inputs =
document.querySelectorAll(
"input, select"
);

inputs.forEach(input =>
{
    input.addEventListener(
    "input",
    calculate
    );
});

document
.getElementById("densityModel")
.addEventListener(
"change",
function(){

    const showCustom =
    this.value === "custom";

    document
    .getElementById("customArea")
    .style.display =
    showCustom
    ? "block"
    : "none";

    calculate();
});

function calculate()
{

    const screenWidth =
    parseFloat(
        document
        .getElementById(
            "screenWidth"
        ).value
    );

    const armLength =
    parseFloat(
        document
        .getElementById(
            "armLength"
        ).value
    );

    const circleWidth =
    parseFloat(
        document
        .getElementById(
            "circleWidth"
        ).value
    );

    const errorBox =
    document.getElementById(
    "error"
    );

    errorBox.textContent = "";

    if(
        circleWidth >
        screenWidth
    )
    {
        errorBox.textContent =
        "Circle width cannot exceed the screen width you entered.";

        document
        .getElementById(
        "galaxyCount"
        )
        .textContent = "-";

        return;
    }

    let density;

    const model =
    document
    .getElementById(
    "densityModel"
    ).value;

    if(model === "custom")
    {
        density =
        parseFloat(
            document
            .getElementById(
                "customDensity"
            ).value
        );
    }
    else
    {
        density =
        parseFloat(model);
    }

    const diameterM =
    circleWidth / 100;

    const armM =
    armLength / 100;

    const angularRad =
    2 *
    Math.atan(
        diameterM /
        (2 * armM)
    );

    const angularDeg =
    angularRad *
    (180 / Math.PI);

    const radiusDeg =
    angularDeg / 2;

    const area =
    Math.PI *
    radiusDeg *
    radiusDeg;

    const galaxies =
    Math.round(
        area *
        density
    );

    document
    .getElementById(
    "galaxyCount"
    )
    .textContent =
    galaxies.toLocaleString();

    document
    .getElementById(
    "angularDiameter"
    )
    .textContent =
    angularDeg.toFixed(3);

    document
    .getElementById(
    "skyArea"
    )
    .textContent =
    area.toFixed(3);

    document
    .getElementById(
    "densityUsed"
    )
    .textContent =
    density.toLocaleString();

    drawCircle(
        screenWidth,
        circleWidth
    );
}

function drawCircle(
screenWidth,
circleWidth
)
{

    const circle =
    document.getElementById(
    "circle"
    );

    const containerWidth =
    Math.min(
        window.innerWidth - 80,
        400
    );

    const pixelsPerCM =
    containerWidth /
    screenWidth;

    const circlePixels =
    circleWidth *
    pixelsPerCM;

    circle.style.width =
    circlePixels + "px";

    circle.style.height =
    circlePixels + "px";
}

calculate();

</script>

</body>
</html>
