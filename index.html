<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Counter</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:#161b22;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:4px;
}

input,select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    background:#21262d;
    color:white;
}

.result{
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    margin-top:20px;
}

.small{
    color:#aaa;
    font-size:0.9rem;
}

.stat{
    margin-top:10px;
}
</style>
</head>

<body>

<h1>Galaxy Counter</h1>

<div class="card">

<h2>Viewing Setup</h2>

<label>Arm Length (cm)</label>
<input
    id="armLength"
    type="number"
    value="60"
    min="10"
    max="150"
>

<label>Circle Diameter (mm)</label>
<input
    id="circleDiameter"
    type="number"
    value="10"
    min="1"
    max="100"
>

<label>Density Model</label>

<select id="model">
    <option value="70000">
        XKCD Estimate
    </option>

    <option value="700000">
        High Estimate
    </option>

    <option value="custom">
        Custom
    </option>
</select>

<label id="customLabel" style="display:none;">
Custom Density
(Galaxies per Square Degree)
</label>

<input
    id="customDensity"
    type="number"
    style="display:none;"
    value="70000"
>

</div>

<div class="card">

<div class="result" id="galaxyCount">
0
</div>

<div style="text-align:center;">
Estimated Galaxies
</div>

<hr>

<div class="stat">
Angular Diameter:
<span id="angularDiameter">0</span>°
</div>

<div class="stat">
Field Area:
<span id="fieldArea">0</span>
square degrees
</div>

<div class="stat">
Density Used:
<span id="densityUsed">0</span>
galaxies/sq°
</div>

</div>

<script>

const modelSelect =
document.getElementById("model");

modelSelect.addEventListener(
    "change",
    function(){

        const custom =
        this.value === "custom";

        document
        .getElementById("customDensity")
        .style.display =
        custom ? "block" : "none";

        document
        .getElementById("customLabel")
        .style.display =
        custom ? "block" : "none";

        calculate();
    }
);

document
.querySelectorAll("input")
.forEach(el => {
    el.addEventListener(
        "input",
        calculate
    );
});

function calculate()
{
    const armCm =
    parseFloat(
        document
        .getElementById(
            "armLength"
        ).value
    );

    const diameterMm =
    parseFloat(
        document
        .getElementById(
            "circleDiameter"
        ).value
    );

    const arm =
    armCm / 100;

    const diameter =
    diameterMm / 1000;

    const angularRad =
        2 *
        Math.atan(
            diameter /
            (2 * arm)
        );

    const angularDeg =
        angularRad *
        (180 / Math.PI);

    const radiusDeg =
        angularDeg / 2;

    const area =
        Math.PI *
        radiusDeg *
        radiusDeg;

    let density;

    if(modelSelect.value === "custom")
    {
        density =
        parseFloat(
            document
            .getElementById(
                "customDensity"
            ).value
        );
    }
    else
    {
        density =
        parseFloat(
            modelSelect.value
        );
    }

    const galaxies =
        Math.round(
            area * density
        );

    document
    .getElementById(
        "galaxyCount"
    )
    .textContent =
        galaxies.toLocaleString();

    document
    .getElementById(
        "angularDiameter"
    )
    .textContent =
        angularDeg.toFixed(3);

    document
    .getElementById(
        "fieldArea"
    )
    .textContent =
        area.toFixed(3);

    document
    .getElementById(
        "densityUsed"
    )
    .textContent =
        density.toLocaleString();
}

calculate();

</script>

</body>
</html>
